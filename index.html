<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульт управления телефоном</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #181825; 
            color: #cdd6f4; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card { 
            background: #1e1e2e; 
            width: 100%;
            max-width: 420px; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #313244;
        }
        h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 12px; color: #cba6f7; }
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            border: 1px solid #45475a; 
            font-size: 15px; 
            box-sizing: border-box; 
            background: #313244; 
            color: #cdd6f4;
            outline: none;
        }
        input:focus { border-color: #89b4fa; }
        button { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 10px; 
            border-radius: 10px; 
            border: none; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #89b4fa; 
            color: #11111b; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .danger { background: #f38ba8; color: #11111b; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid button { margin-bottom: 0; background: #a6e3a1; }
        hr { border: 0; height: 1px; background: #45475a; margin: 20px 0; }
        .status { text-align: center; font-size: 13px; color: #a6adc8; margin-top: 8px; min-height: 18px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🗣️ Озвучить текст на телефоне</h2>
    <input type="text" id="textInput" placeholder="Введите текст...">
    <button onclick="sendText()">Отправить сообщение</button>

    <hr>

    <h2>📢 Быстрые фразы</h2>
    <div class="grid">
        <button onclick="sendQuickText('Привет!')">👋 Привет</button>
        <button onclick="sendQuickText('Положи телефон!')">🛑 Положи!</button>
    </div>

    <div class="status" id="statusText"></div>
</div>

<script>
    // Твоя точная ссылка с триггером speek
    const BASE_URL = "https://trigger.macrodroid.com/8e130c4a-0041-4dc3-9027-3367938c41b0/speek"; 

    function showStatus(msg) {
        const status = document.getElementById('statusText');
        status.innerText = msg;
        setTimeout(() => { status.innerText = ''; }, 3000);
    }

    function sendText() {
        const input = document.getElementById('textInput');
        const text = input.value.trim();
        if(!text) {
            showStatus('⚠️ Введите текст!');
            return;
        }
        
        fetch(`${BASE_URL}?text=${encodeURIComponent(text)}`, { mode: 'no-cors' });
        showStatus('✅ Текст отправлен!');
        input.value = '';
    }

    function sendQuickText(text) {
        fetch(`${BASE_URL}?text=${encodeURIComponent(text)}`, { mode: 'no-cors' });
        showStatus(`✅ Отправлено: "${text}"`);
    }
</script>

</body>
</html>
